<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Archives</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site_styles.css">
<style>
  .archive-filters {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 2.5rem;
  }

  .filter-btn {
    font-family: 'Indie Flower', cursive;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.35rem 1rem;
    border: 1px solid #00000020;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
  }

  .filter-btn:hover {
    border-color: #00000040;
    color: var(--text);
  }

  .filter-btn.active {
    border-color: var(--gold);
    color: var(--gold);
    background: #ee3f3f10;
  }

  .archive-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1.5rem;
  }

  .archive-card {
    background: var(--bg2);
    border: 1px solid #00000008;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.2s;
  }

  .archive-card:hover {
    border-color: #00000025;
    transform: translateY(-3px);
  }

  .archive-thumb-wrap {
    position: relative;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: var(--bg2);
  }

  .archive-thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    /* Blurred by default — same reveal-on-hover effect as before */
    filter: blur(6px);
    transform: scale(1.05);
    transition: filter 0.4s ease, transform 0.4s ease;
  }

  .archive-card:hover .archive-thumb-wrap img {
    filter: blur(0px);
    transform: scale(1);
  }

  .archive-thumb-video {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #00000012 0%, #00000005 100%);
  }

  .archive-play-icon {
    width: 0;
    height: 0;
    border-top: 14px solid transparent;
    border-bottom: 14px solid transparent;
    border-left: 22px solid var(--gold);
    opacity: 0.65;
    transition: opacity 0.2s, transform 0.2s;
  }

  .archive-card:hover .archive-play-icon {
    opacity: 1;
    transform: scale(1.15);
  }

  .archive-body {
    padding: 1rem 1.1rem;
  }

  .archive-caption {
    font-size: 0.95rem;
    line-height: 1.5;
    color: var(--text);
    margin-bottom: 0.4rem;
  }

  .archive-year {
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
  }

  /* Lightbox overlay (images only — videos open in a new tab) */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 900;
    background: rgba(0,0,0,0.85);
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .lightbox.open {
    display: flex;
  }

  .lightbox img {
    max-width: 90vw;
    max-height: 90vh;
    object-fit: contain;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .lightbox-close {
    position: absolute;
    top: 1.5rem;
    right: 2rem;
    color: white;
    font-size: 2rem;
    cursor: pointer;
    font-family: 'Playfair Display', serif;
    line-height: 1;
  }

  .archive-loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    padding: 5rem 0;
    color: var(--muted);
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .archive-error {
    padding: 3rem;
    text-align: center;
    color: var(--muted);
    border: 1px solid #00000010;
    background: var(--bg2);
  }

  .archive-error a { color: var(--gold); }

  .empty-state {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.7;
  }
</style>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="nav-brand">Home</a>
  <input type="checkbox" id="nav-toggle" class="nav-toggle-input">
  <label for="nav-toggle" class="nav-hamburger" aria-label="Open menu">
    <span></span><span></span><span></span>
  </label>
  <div class="nav-links">
    <a href="news.html">Today's News</a>
    <a href="ideals.html">Exploring Your IDEALS</a>
    <a href="quiz.html">Take the IDEALS quiz</a>
    <a href="info.html">Round Square &amp; More</a>
    <a href="mailto:icskumasi.news@gmail.com">Feedback</a>
  </div>
</nav>

<div class="page-body">
  <div class="page-inner">
    <h1 class="page-title">The Archives</h1>
    <p class="page-sub">Photos and videos from past academic years. Hover a photo to preview, click to open. Click a video to watch it.</p>

    <div class="archive-filters" id="filters"></div>

    <div class="archive-grid" id="gallery"></div>
  </div>
</div>

<!-- Lightbox (images only) -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="lightbox-close">×</span>
  <img id="lightbox-img" src="" alt="">
</div>

<script src="archives.js"></script>

</body>
</html>
