<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exploring Your IDEALS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="quiz_styles.css">
<style>
  .ideals-grid {
    display: flex;
    flex-direction: column;
    gap: 3rem;
  }

  .ideal-card {
    border-left: 3px solid currentColor;
    padding: 0 0 0 1.5rem;
  }

  .ideal-card-name {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 900;
    line-height: 1;
    margin-bottom: 0.75rem;
  }

  .ideal-card-tagline {
    font-size: 1.05rem;
    color: var(--muted);
    margin-bottom: 1rem;
    font-style: italic;
  }

  .ideal-card-body {
    font-size: 1rem;
    line-height: 1.8;
    color: var(--text);
    max-width: 600px;
  }

  .ideal-card-traits {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 1rem;
  }

  .trait {
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.3rem 0.75rem;
    border: 1px solid currentColor;
    opacity: 0.6;
  }

  .divider {
    width: 100%;
    height: 1px;
    background: #00000010;
  }
</style>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="nav-brand">ICS News</a>
  <input type="checkbox" id="nav-toggle" class="nav-toggle-input">
  <label for="nav-toggle" class="nav-hamburger" aria-label="Open menu">
    <span></span><span></span><span></span>
  </label>
  <div class="nav-links">
    <a href="news.html">Today's News</a>
    <a href="ideals.html" class="active">Exploring Your IDEALS</a>
    <a href="archives.html">The Archives</a>
    <a href="mailto:icskumasi.news@gmail.com">Feedback</a>
  </div>
</nav>

<!-- The orbital diagram lives inside this container -->
<div id="orbital">

  <svg id="orbit-svg" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;"></svg>

  <!-- The centre label -->
  <div id="orbital-centre">
    <span>Round Square</span>
  </div>

  <!-- One div per IDEAL node — you'll position these with JS later -->
  <div class="ideal-node" data-ideal="I">I</div>
  <div class="ideal-node" data-ideal="D">D</div>
  <div class="ideal-node" data-ideal="E">E</div>
  <div class="ideal-node" data-ideal="A">A</div>
  <div class="ideal-node" data-ideal="L">L</div>
  <div class="ideal-node" data-ideal="S">S</div>

  <!-- Discovery nodes — data-parent ties them to their IDEAL -->
  <div class="discovery-node" data-parent="I" data-name="Diversity Dani"></div>
  <div class="discovery-node" data-parent="I" data-name="Communication Cara"></div>
  <div class="discovery-node" data-parent="D" data-name="Courageous Collette"></div>
  <div class="discovery-node" data-parent="D" data-name="Self-Aware Simba"></div>
  <div class="discovery-node" data-parent="E" data-name="Sustainability Suki"></div>
  <div class="discovery-node" data-parent="E" data-name="Responsible Rami"></div>
  <div class="discovery-node" data-parent="A" data-name="Inquisitive Indu"></div>
  <div class="discovery-node" data-parent="A" data-name="Tenacious Tino"></div>
  <div class="discovery-node" data-parent="L" data-name="Inventive Idris"></div>
  <div class="discovery-node" data-parent="L" data-name="Problem Solving Papri"></div>
  <div class="discovery-node" data-parent="S" data-name="Compassionate Carlos"></div>
  <div class="discovery-node" data-parent="S" data-name="Teamwork Tama"></div>

  <!-- Popup — one popup, reused for both IDEAL and Discovery clicks -->
  <div id="popup" class="hidden">
    <button id="popup-close">×</button>
    <p id="popup-tag"></p>
    <h2 id="popup-title"></h2>
    <p id="popup-body"></p>
    <a id="popup-link" href="#" target="_blank">Read this week's story →</a>
  </div>

</div>
<script src="quiz_script.js"></script>
<script src="orbital.js"></script>
</body>
</html>
